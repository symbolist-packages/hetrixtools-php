  /uptime-monitors/{monitor_id}/server-agent/processes:
    get:
      summary: Running Processes
      description: |
        API call used to get the latest running processes snapshot collected by an uptime monitor's Server Monitoring Agent.

        The [View Running Processes](https://docs.hetrixtools.com/view-running-processes/) option must be enabled on the Server Monitoring Agent in order for this data to be collected. The snapshot is refreshed with every agent data post, and this API call will return a `404` response if no recent running processes data is found for the specified monitor.
      parameters:
        - name: monitor_id
          in: path
          description: The unique uptime monitor id, which can be found by running the [GET - Uptime Monitors](https://docs.hetrixtools.com/api/v3/#/paths/~1uptime-monitors/get) API.
          required: true
          style: simple
          explode: false
          schema:
            type: string
            pattern: '^[A-Za-z0-9]{32}$'
        - name: per_page
          in: query
          description: Number of processes returned per page.
          style: form
          explode: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 200
        - name: page
          in: query
          description: Which page of the paginated results to return.
          style: form
          explode: false
          schema:
            type: integer
            default: 1
            minimum: 1
            maximum: 10000
        - name: order_by
          in: query
          description: Which usage metric to order the processes by.
          required: false
          style: form
          explode: false
          schema:
            type: string
            enum: [cpu, ram]
            default: cpu
        - name: order
          in: query
          description: The direction to order the processes in.
          required: false
          style: form
          explode: false
          schema:
            type: string
            enum: [desc, asc]
            default: desc
      responses:
        '200':
          description: Successful Response.
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      processes:
                        type: array
                        items:
                          type: object
                          properties:
                            pid:
                              type: integer
                              description: The process ID.
                            ppid:
                              type: integer
                              description: The parent process ID.
                            uid:
                              type: integer
                              description: The user ID of the process owner.
                            user:
                              type: string
                              description: The username of the process owner.
                            elapsed:
                              type: integer
                              description: The number of seconds the process has been running for.
                            cpu:
                              type: number
                              description: The CPU usage (percent) of the process, normalized by the number of CPU cores.
                            ram:
                              type: number
                              description: The RAM usage (percent) of the process.
                            process:
                              type: string
                              description: The process name.
                            command:
                              type: string
                              description: The full command the process has been started with.
                  - type: object
                    properties:
                      meta:
                        type: object
                        properties:
                          total:
                            type: integer
                            description: The total number of running processes in the latest snapshot.
                          returned:
                            type: integer
                            description: The number of processes returned by the API call.
                          last_updated:
                            type: integer
                            description: The timestamp when the running processes snapshot was last updated.
                          pagination:
                            type: object
                            properties:
                              current:
                                type: integer
                                description: The current page number.
                              last:
                                type: integer
                                description: The last available page number.
                              previous:
                                type: integer
                                nullable: true
                                description: The previous page number; `null` returned if no previous pages available.
                              next:
                                type: integer
                                nullable: true
                                description: The next page number; `null` returned if no further pages available.
              example:
                processes:
                  - pid: 1863
                    ppid: 1
                    uid: 112
                    user: mysql
                    elapsed: 172800
                    cpu: 25.75
                    ram: 17.3
                    process: mysqld
                    command: /usr/sbin/mysqld
                  - pid: 850
                    ppid: 1
                    uid: 0
                    user: root
                    elapsed: 172811
                    cpu: 1.2
                    ram: 2.5
                    process: fail2ban-server
                    command: /usr/bin/python3 /usr/bin/fail2ban-server -xf start
                meta:
                  total: 132
                  returned: 2
                  last_updated: 1641909671
                  pagination:
                    current: 1
                    last: 66
                    previous: null
                    next: 2
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/RateLimitedError'
      security:
        - bearerAuth: []
    x-summary: Uptime Monitors
  /uptime-monitors/{monitor_id}/server-agent/warning-policies:
    get:
      summary: Warning Policies
      description: |
        API call used to get an uptime monitor's Server Agent warning policies.

        Each warning policy can have its own Contact List (`contact_list`), overwriting the uptime monitor's Contact List. Warning policies without such an overwrite return `null` and send their notifications to the uptime monitor's Contact List.
      parameters:
        - name: monitor_id
          in: path
          description: The unique uptime monitor id, which can be found by running the [GET - Uptime Monitors](https://docs.hetrixtools.com/api/v3/#/paths/~1uptime-monitors/get) API.
          required: true
          style: simple
          explode: false
          schema:
            type: string
      responses:
        '200':
          description: Successful Response.
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      agent_data_warn:
                          type: object
                          description: Issue warnings when the server monitoring agent hasn't sent data.
                          properties:
                            enabled:
                              type: boolean
                              description: Defines whether or not this policy is enabled.
                            threshold:
                              type: integer
                              enum: [3, 5, 10, 15, 30, 60]
                              description: The number of consecutive minutes without agent data received required to trigger a warning.
                            warn_frequency:
                              type: integer
                              enum: [5, 10, 15, 30, 60, 180, 360, 720, 1440]
                              description: The minimum number of minutes between each issued warning.
                            contact_list:
                              type: string
                              nullable: true
                              description: |
