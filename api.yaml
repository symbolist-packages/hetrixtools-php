  /schedule-maintenance:
    get:
      summary: Schedule Maintenance
      description: |
        API call used to list all scheduled maintenance windows.
      parameters:
        - name: per_page
          in: query
          description: Number of maintenance windows returned per page.
          style: form
          explode: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 200
        - name: page
          in: query
          description: Which page of the paginated results to return.
          style: form
          explode: false
          schema:
            type: integer
            default: 1
            minimum: 1
            maximum: 10000
        - name: monitor_id
          in: query
