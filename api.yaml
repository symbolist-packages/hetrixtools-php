        '200':
          description: Successful Response.
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      scheduled_maintenances:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: The unique schedule maintenance ID.
                            monitor_id:
                              type: string
                              description: The ID of the monitor under maintenance.
                            start:
                              type: string
                              format: date-time
                              description: Maintenance start time as string (YYYY-MM-DD HH:MM).
                            end:
                              type: string
                              format: date-time
                              description: Maintenance end time as string (YYYY-MM-DD HH:MM).
                            timezone:
                              type: string
                              description: Timezone of the maintenance window.
                            with_notifications:
                              type: boolean
                              description: Whether notifications are enabled for this maintenance.
                            recurring:
                              type: boolean
                              description: Whether this maintenance is recurring.
                            recurring_time:
                              type: integer
                              description: Recurring interval value.
                            recurring_time_type:
                              type: string
                              description: Recurring interval type (hour, day, week, month, year).
                  - type: object
                    properties:
                      meta:
                        type: object
                        properties:
                          total:
                            type: integer
                            description: Total number of scheduled maintenance windows.
                          total_filtered:
                            type: integer
                            description: Total number of filtered scheduled maintenance windows.
                          returned:
                            type: integer
                            description: Number of scheduled maintenance windows returned in this response.
                          pagination:
                            type: object
                            properties:
                              current:
                                type: integer
                              last:
                                type: integer
                              previous:
                                type: integer
                                nullable: true
                              next:
                                type: integer
                                nullable: true
              example:
                  scheduled_maintenances:
                  - id: abc123def456ghi789jkl012mno345pq
                    monitor_id: e34334dt5t755b034606y54ccabe62e8
                    start: "2025-06-06 10:00"
                    end: "2025-06-06 12:00"
                    timezone: "America/New_York"
                    with_notifications: true
                    recurring: false
                    recurring_time: 0
