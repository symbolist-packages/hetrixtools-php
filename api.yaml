                          announcement_title:
                            type: string
                            description: The title of the announcement that is displayed on this status page.
                          announcement_body:
                            type: string
                            description: The body of the announcement that is displayed on this status page.
                          announcement_affected:
                            type: array
                            description: The array of monitors that are affected by the announcement that is displayed on this status page.
                            items:
                              type: string
                              minLength: 32
                              maxLength: 32
