  /uptime-monitors/{monitor_id}/server-agent/metrics:
    get:
      summary: Server Agent Metrics
      description: |-
        API call used to get an uptime monitor's Server Monitoring Agent metrics, including system and hardware details, disks, network interfaces, services, outgoing pings, custom variables, and metric history. This endpoint is not paginated.

        Without `from`, `to`, or `interval`, the response contains the latest agent snapshot and up to 60 recent `stats` points from the last hour. In this default response, `meta.history`, `bucket_end`, and `partial` are omitted.

        ### Historical ranges

        Supply `from` and `to` together as Unix timestamps in seconds. Only `stats` is filtered by the requested range; all other sections remain the latest agent snapshot. Supplying only `interval` requests the last hour with history metadata. If both bounds are supplied and `interval` is omitted, the interval is `auto`.

        ```http
        GET /v3/uptime-monitors/{monitor_id}/server-agent/metrics?interval=auto
        GET /v3/uptime-monitors/{monitor_id}/server-agent/metrics?from=1789552800&to=1789560000&interval=1h
        ```

        Automatic resolution is selected from the requested duration:

        | Duration | Interval |
        | --- | --- |
        | Up to 72 hours (including 3h and 6h) | `1m` |
        | More than 72 hours, up to 30 days (including 7d and 30d) | `1h` |
        | More than 30 days (including 6 months) | `1d` |

        Minute history is available only within the last 30 calendar days. An automatic minute range starting before that cutoff is promoted to `1h`; an explicit `1m` request starting before the cutoff returns `400`. Hourly and daily history can cover older periods where data exists.

        The maximum range is 2,190 days, and a request may select at most 5,000 bucket starts, including buckets with no data. Requests exceeding either limit return `400`; choose a coarser interval or split the range. An explicit interval can be finer than the automatic choice within these limits, for example 180 days at `1h`.
      parameters:
        - name: monitor_id
          in: path
          description: The unique uptime monitor id, which can be found by running the [GET - Uptime Monitors](https://docs.hetrixtools.com/api/v3/#/paths/~1uptime-monitors/get) API.
          required: true
          style: simple
          explode: false
          schema:
            type: string
            pattern: ^[A-Za-z0-9]{32}$
        - name: from
          in: query
          description: Inclusive start of the history range, as a Unix timestamp in seconds. Must be supplied together with to and be strictly earlier than to. Bounds select bucket starts.
          required: false
          style: form
          explode: false
          schema:
            type: integer
            format: int64
            minimum: 0
            maximum: 9999999999
          example: 1789552800
        - name: to
          in: query
          description: Exclusive end of the history range, as a Unix timestamp in seconds. Must be supplied together with from and must not be in the future.
          required: false
          style: form
          explode: false
          schema:
            type: integer
            format: int64
            minimum: 0
            maximum: 9999999999
          example: 1789560000
        - name: interval
          in: query
          description: History resolution. auto selects the interval from the range and minute-retention rules above. Supplying interval without from/to selects the last hour with history metadata.
          required: false
          style: form
          explode: false
          schema:
            type: string
            enum:
              - auto
              - 1m
              - 1h
              - 1d
            default: auto
      responses:
        '200':
          description: Successful Response.
          content:
            application/json:
              schema:
                type: object
                required:
                  - agent
                  - system
                  - cpu
                  - memory
                  - disk
                  - network_interfaces
                  - services
                  - port_connections
                  - outgoing_pings
                  - custom_variables
                  - stats
                  - meta
                properties:
                  agent:
                    type: object
                    description: The latest agent details.
                    properties:
                      id:
                        type: string
                        description: The unique Server Monitoring Agent ID (SID).
                      version:
                        type: string
                        description: The installed agent version; null when unavailable.
                        nullable: true
                      type:
                        type: string
                        description: The agent type.
                        enum:
                          - linux
                          - php
                          - windows
                          - macos
                          - unknown
                      ip_address:
                        type: string
                        description: The IPv4 or IPv6 address recorded for the latest agent data post; null when unavailable.
                        nullable: true
                      date_added:
                        type: integer
                        description: The Unix timestamp in seconds when the agent was added.
                        format: int64
                  system:
                    type: object
                    properties:
                      hostname:
                        type: string
                        description: The server hostname; null when unavailable.
                        nullable: true
                      operating_system:
                        type: string
                        description: The operating system; null when unavailable.
                        nullable: true
                      kernel:
                        type: string
                        description: The kernel version; null when unavailable.
                        nullable: true
                      uptime:
                        type: integer
                        description: The system uptime in seconds.
                        format: int64
                      reboot_required:
                        type: boolean
                        description: Whether the agent reports that a reboot is required.
                  cpu:
                    type: object
                    properties:
                      model:
                        type: string
                        description: The CPU model; null when unavailable.
                        nullable: true
                      speed:
                        type: integer
                        description: The CPU clock speed in MHz; 0 when unavailable.
                        format: int64
                      sockets:
                        type: integer
                        description: The number of CPU sockets.
                        format: int64
                      cores:
                        type: integer
                        description: The number of physical CPU cores.
                        format: int64
                      threads:
                        type: integer
                        description: The number of logical CPU threads.
                        format: int64
                  memory:
                    type: object
                    properties:
                      ram_size:
                        type: integer
                        description: The total RAM size in bytes.
                        format: int64
                      swap_size:
                        type: integer
                        description: The total swap size in bytes.
                        format: int64
                  disk:
                    type: object
                    properties:
                      total_size:
                        type: integer
                        description: The approximate total disk size in bytes.
                        format: int64
