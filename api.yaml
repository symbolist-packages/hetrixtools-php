      responses:
        '200':
          description: Successful Response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  private_notes:
                    type: string
                    description: The monitor's private notes, up to 1024 UTF-8 bytes. Returns an empty string when no notes are set.
              example:
                private_notes: "Production database\nOwner: operations"
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
