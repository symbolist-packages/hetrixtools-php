openapi: 3.0.1
info:
  title: HetrixTools - API v3
  version: '3.0'
  description: |
    # Introduction
    The HetrixTools v3 API is a REST API which you can use to programmatically perform different CRUD (create, retrieve, update, delete) operations on your HetrixTools account.
  
    ## Request Methods
    
    |Method|Usage|
    |--- |--- |
    |GET|Read-only request used to fetch information as a JSON object.|
    |POST|Used to create a new object.|
    |PUT|Used to update an existing object.|
    |DELETE|Used to delete an existing object.|
    
    ## HTTP Statuses
    
    |Code|Meaning|
    |--- |--- |
    |200|Successful Request - object(s) returned.|
    |204|No Content - the request was performed successfully, but there was no content found/returned.|
    |400|Bad Request - the API request is invalid or formatted wrong.|
    |401|Unauthorized - invalid authorization method, missing or invalid bearer token.|
    |403|Forbidden - the specified API key (bearer token) does not have access to perform the requested action. [Learn how to configure API access](https://docs.hetrixtools.com/api-keys-access/).|
    |404|Not Found - the resource you have requested was not found.|
    |429|Rate Limited - you are performing API requests too frequently.|
    |5xx|Server Error - our API server either encountered an internal error or is unable to serve your API request at this time.|
    
    ## Rate Limiting
    Our API has two types of rate limiting:
     - Per user - your account can only perform a maximum number of API calls per minute or per hour, based on your pricing plan.
     - Per endpoint - some endpoints may have their own rate limiting, which is not affected by the user's pricing plan.
     
    If you ever hit any of the rate limits, you will receive the `429` HTTP response code.
    
    ### User Response Headers
    ```
    ratelimit-limit-user: 200
    ratelimit-remaining-user: 199
    ratelimit-reset-user: 1640005680
    ```
    
    ### Endpoint Response Headers
    ```
    ratelimit-limit-endpoint: 100
    ratelimit-remaining-endpoint: 99
    ratelimit-reset-endpoint: 1640005680
    ```
    
    ### Response Headers Explained
    - **ratelimit-limit-{user/endpoint}** - the maximum limit of API calls that can be performed
    - **ratelimit-remaining-{user/endpoint}** - the remaining number of API calls that can be performed until the reset time
    - **ratelimit-reset-{user/endpoint}** - the time when the two values listed above will reset
    
    ### Rate Limiting Sample Response
    ```
    429 Too Many Requests
    {
      "status": "too_many_requests",
      "message": "user api rate limit exceeded"
    }
    ```
    
servers:
  - url: https://api.hetrixtools.com/v3/
    description: HetrixTools API Server
paths:
  /account/limits:
    get:
      summary: Account Limits
      description: |
        API call used to get the current usage and limits for your HetrixTools account.
        This endpoint is not paginated.
      responses:
        '200':
          description: Successful Response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  uptime:
                    type: object
                    properties:
                      monitors:
                        type: object
                        properties:
                          usage:
                            type: integer
                            description: The current number of uptime monitors in use.
                          limit:
                            type: integer
                            description: The maximum number of uptime monitors allowed.
                  blacklist:
                    type: object
                    properties:
                      monitors:
                        type: object
                        properties:
                          usage:
                            type: integer
                            description: The current number of blacklist monitors in use.
                          limit:
                            type: integer
                            description: The maximum number of blacklist monitors allowed.
                      api_check_credits:
                        type: object
                        properties:
                          usage:
                            type: integer
                            description: The number of blacklist API checks used this month (plan + extra credits).
                          limit:
                            type: integer
                            description: The total number of blacklist API checks available this month (plan + extra credits).
                          details:
                            type: object
                            properties:
                              monthly_from_plans:
                                type: integer
                                description: The number of monthly blacklist API checks included in your plan(s).
                              extra_credits:
                                type: integer
                                description: Extra purchased blacklist API check credits.
                  sub_accounts:
                    type: object
                    properties:
                      usage:
                        type: integer
                        description: The current number of sub-accounts and pending invites.
                      limit:
                        type: integer
                        description: The maximum number of sub-accounts allowed.
                  sms_credits:
                    type: object
                    properties:
                      usage:
                        type: integer
                        description: The number of SMS credits used this month (plan + extra credits).
                      limit:
                        type: integer
                        description: The total number of SMS credits available this month (plan + extra credits).
                      details:
                        type: object
                        properties:
                          monthly_from_plans:
                            type: integer
                            description: The number of monthly SMS credits included in your plan(s).
                          extra_credits:
                            type: integer
                            description: Extra purchased SMS credits.
                  account_credit:
                    type: object
                    properties:
                      balance:
                        type: number
                        format: float
                        description: The current prepaid account credit balance.
                  api_v1_v2:
                    type: object
                    properties:
                      usage:
                        type: integer
                        description: The number of API v1/v2 calls used this month.
                      limit:
                        type: integer
                        description: The maximum number of API v1/v2 calls allowed per month.
              example:
                uptime:
                  monitors:
                    usage: 12
                    limit: 50
                blacklist:
                  monitors:
                    usage: 3
                    limit: 20
                  api_check_credits:
                    usage: 40
                    limit: 100
                    details:
                      monthly_from_plans: 100
                      extra_credits: 0
                sub_accounts:
                  usage: 1
                  limit: 5
                sms_credits:
                  usage: 2
                  limit: 50
                  details:
                    monthly_from_plans: 50
                    extra_credits: 0
                account_credit:
                  balance: 12.5
                api_v1_v2:
                  usage: 300
                  limit: 1000
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '429':
          $ref: '#/components/responses/RateLimitedError'
      security:
        - bearerAuth: []
    x-summary: Account Limits

  /contact-lists:
    get:
      summary: Contact Lists
      description: |
        API call used to get contact lists and their details.
      parameters:
        - name: per_page
          in: query
          description: Number of monitors returned per page.
          style: form
          explode: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 200
        - name: page
          in: query
          description: Which page of the paginated results to return.
          style: form
          explode: false
          schema:
            type: integer
            default: 1
            minimum: 1
            maximum: 10000
      responses:
        '200':
          description: Successful Response.
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      contact_lists:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              minLength: 32
                              maxLength: 32
                              description: The unique contact list ID.
                            name:
                              type: string
                              description: The contact list's name.
                            default:
                              type: boolean
                              description: Whether or not this is the default contact list.
                            email:
                              type: array
                              description: Emails in this contact list.
                              items:
                                type: string
                            phone_sms:
                              type: array
                              description: SMS numbers in this contact list.
                              items:
                                type: string
                            telegram:
                              type: array
                              description: Telegram usernames in this contact list.
                              items:
                                type: string
                            pushbullet:
                              type: array
                              description: Pushbullet usernames in this contact list.
                              items:
                                type: string
                            pushover:
                              type: object
                              properties:
                                key:
                                  type: string
                                  description: The Pushover API key.
                                priority:
                                  type: integer
                                  description: The Pushover priority.
                            twitter:
                              type: array
                              description: \[DEPRECATED\] Twitter usernames in this contact list.
                              items:
                                type: string
                            slack:
                              type: object
                              properties:
                                webhook:
                                  type: string
                                  description: The Slack webhook URL.
                                target:
                                  type: string
                                  description: The Slack target channel.
                                hide_target:
                                  type: boolean
                                  description: Whether or not to hide the monitored target in the notification.
                            discord:
                              type: object
                              properties:
                                webhook:
                                  type: string
                                  description: The Discord webhook URL.
                                target:
                                  type: string
                                  description: The Discord target channel.
                                hide_target:
                                  type: boolean
                                  description: Whether or not to hide the monitored target in the notification.
                            mattermost_rocketchat:
                              type: object
                              properties:
                                webhook:
                                  type: string
                                  description: The Mattermost/Rocket.Chat webhook URL.
                                target:
                                  type: string
                                  description: The Mattermost/Rocket.Chat target channel.
                                hide_target:
                                  type: boolean
                                  description: Whether or not to hide the monitored target in the notification.
                            microsoft_teams:
                              type: object
                              properties:
                                webhook:
                                  type: string
                                  description: The Microsoft Teams webhook URL.
                            pagerduty:
                              type: object
                              properties:
                                key:
                                  type: string
                                  description: The PagerDuty API key.
                            opsgenie:
                              type: object
                              properties:
                                key:
                                  type: string
                                  description: The OpsGenie API key.
                                priority:
                                  type: string
                                  description: The OpsGenie priority.
                            victorops:
                              type: object
                              properties:
                                key:
                                  type: string
                                  description: The VictorOps API key.
                                route:
                                  type: string
                                  description: The VictorOps route.
                                priority:
                                  type: string
                                  description: The VictorOps priority.
                            webhook:
                              type: object
                              properties:
                                url:
                                  type: string
                                  description: The Webhook URL.
                                authentication:
                                  type: string
                                  description: The Webhook authentication method.
                            dnd:
                              type: array
                              items:
                                type: object
                                properties:
                                  day:
                                    type: string
                                    description: The day of the week.
                                  hour:
                                    type: string
                                    description: The hour of the day.
                  - type: object
                    properties:
                      meta:
                        type: object
                        properties:
                          total:
                            type: integer
                            description: The total number of contact lists found.
                          returned:
                            type: integer
                            description: The number of contact lists returned in this response.
                          pagination:
                            type: object
                            properties:
                              current:
                                type: integer
                                description: The current page number.
                              last:
                                type: integer
                                description: The last available page number.
                              previous:
                                type: integer
                                nullable: true
                                description: The previous page number; `null` returned if no previous pages available.
                              next:
                                type: integer
                                nullable: true
                                description: The next page number; `null` returned if no further pages available.
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '429':
          $ref: '#/components/responses/RateLimitedError'
      security:
        - bearerAuth: []
    x-summary: Contact Lists
  /blacklists:
    get:
      summary: Blacklists
      description: |
        API call used to get the list of blacklists (RBLs) checked by our platform.
      responses:
        '200':
          description: Successful Response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ipv4:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: The unique identifier for the RBL entry.
                        rbl:
                          type: string
                          description: The RBL (Real-time Blackhole List) name.
                        optional:
                          type: boolean
                          description: Whether the RBL is optional (opt-in).
                        ignored:
                          type: boolean
                          description: Whether the RBL is ignored.
                  domains:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: The unique identifier for the RBL entry.
                        rbl:
                          type: string
                          description: The RBL (Real-time Blackhole List) name.
                        optional:
                          type: boolean
                          description: Whether the RBL is optional (opt-in).
                        ignored:
                          type: boolean
                          description: Whether the RBL is ignored.
              example:
                ipv4:
                  - id: "hostkarma.junkemailfilter.com"
                    rbl: "hostkarma.junkemailfilter.com"
                    optional: false
                    ignored: false
                  - id: "invaluement_sip"
                    rbl: "invaluement SIP"
                    optional: false
                    ignored: false
                  - id: "invaluement_sip_24"
                    rbl: "invaluement SIP/24"
                    optional: false
                    ignored: false
                  - id: "nordspam"
                    rbl: "NordSpam"
                    optional: false
                    ignored: false
                  - id: "ips.backscatterer.org"
                    rbl: "ips.backscatterer.org"
                    optional: false
                    ignored: false
                domains:
                  - id: "dnsbl.spfbl.net"
                    rbl: "dnsbl.spfbl.net"
                    optional: false
                    ignored: false
                  - id: "phishtank"
                    rbl: "PhishTank"
                    optional: false
                    ignored: false
                  - id: "nordspam"
                    rbl: "NordSpam"
                    optional: false
                    ignored: false
                  - id: "hostkarma.junkemailfilter.com"
                    rbl: "hostkarma.junkemailfilter.com"
                    optional: false
                    ignored: false
                  - id: "invaluement_uri"
                    rbl: "invaluement URI"
                    optional: false
                    ignored: false
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '429':
          $ref: '#/components/responses/RateLimitedError'
      security:
        - bearerAuth: []
    x-summary: Blacklists
  /blacklist-monitors:
    get:
      summary: Blacklist Monitors
      description: |
        API call used to get blacklist monitors and their details.
      parameters:
        - name: per_page
          in: query
          description: Number of monitors returned per page.
          style: form
          explode: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 1024
        - name: page
          in: query
          description: Which page of the paginated results to return.
          style: form
          explode: false
          schema:
            type: integer
            default: 1
            minimum: 1
            maximum: 10000
        - name: name
          in: query
          description: Filter results by name (accepts partial or full name).
          required: false
          style: form
          schema:
            type: string
            pattern: "^[a-zA-Z0-9 .-]+$"
        - name: exact_name
          in: query
          description: If set to `true`, the `name` filter will perform an exact match on the monitored name; all other filters will be ignored.
          required: false
          style: form
          schema:
            type: boolean
        - name: target
          in: query
          description: Filter results by monitored target (accepts partial or full target).
          required: false
          style: form
          schema:
            type: string
            pattern: "^[a-zA-Z0-9.-]+$"
        - name: exact_target
          in: query
          description: If set to `true`, the `target` filter will perform an exact match on the monitored target; all other filters will be ignored.
          required: false
          style: form
          schema:
            type: boolean
        - name: cidr
          in: query
          description: If specified, the `target` filter will be treated as a CIDR range with the specified prefix length and will match all IPs within that range.
          required: false
          style: form
          schema:
            type: integer
            minimum: 21
            maximum: 32
        - name: type
          in: query
          description: Filter results by monitor type.
          required: false
          style: form
          schema:
            type: string
            enum: [ipv4, domain]
        - name: listed
          in: query
          description: Filter results by listed status.
          required: false
          style: form
          schema:
            type: boolean
        - name: order
          in: query
          description: Order results ascending or descending.
          required: false
          style: form
          schema:
            type: string
            enum: [asc, desc]
        - name: order_by
          in: query
          description: Order results by a specific field.
          required: false
          style: form
          schema:
            type: string
            enum: [name, target, listed, created_at, last_check]
      responses:
        '200':
          description: Successful Response.
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      monitors:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              minLength: 32
                              maxLength: 32
                              description: The unique blacklist monitor ID.
                            name:
                              type: string
                              description: The blacklist monitor's name.
                            type:
                              type: string
                              enum: [ipv4, domain]
                              description: The type of blacklist monitor.
                            target:
                              type: string
                              description: The monitored target.
                            rdns:
                              type: string
                              nullable: true
                              description: The reverse DNS for the monitored target, if it exists; otherwise `null`.
                            report_id:
                              type: string
                              minLength: 32
                              maxLength: 32
                              description: |
                                The unique blacklist report ID for this blacklist monitor.  
                                Can be used to form the non white-label report URL: `https://hetrixtools.com/report/blacklist/{report_id}/`  
                                And the white-label report URL: `https://yourdomain.com/report/blacklist/{report_id}/`
                            status:
                              type: string
                              enum: [active, disabled, processing]
                              description: The current status of this blacklist monitor.
                            contact_lists:
                              type: array
                              description: The unique contact list IDs assigned to this blacklist monitor. Currently supporting a maximum of one contact list ID per blacklist monitor.
                              items:
                                type: string
                                minLength: 32
                                maxLength: 32
                            listed:
                              type: array
                              description: The array of blacklists that have listed the monitored target.
                              items:
                                type: object
                                properties:
                                  rbl:
                                    type: string
                                    description: The RBL name.
                                  delist:
                                    type: string
                                    description: The delist URL for this RBL.
                            created_at:
                              type: integer
                              description: Timestamp when the blacklist monitor was created.
                            last_check:
                              type: integer
                              description: Timestamp when the blacklist monitor was last checked.
                  - type: object
                    properties:
                      meta:
                        type: object
                        properties:
                          total:
                            type: integer
                            description: The total number of uptime monitors available in your account.
                          total_filtered:
                            type: integer
                            description: The number of uptime monitors found after filtering has been applied.
                          returned:
                            type: integer
                            description: The number of uptime monitors returned by this API call.
                          pagination:
                            type: object
                            properties:
                              current:
                                type: integer
                                description: The current page number.
                              last:
                                type: integer
                                description: The last available page number.
                              previous:
                                type: integer
                                nullable: true
                                description: The previous page number; `null` returned if no previous pages available.
                              next:
                                type: integer
                                nullable: true
                                description: The next page number; `null` returned if no further pages available.
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '429':
          $ref: '#/components/responses/RateLimitedError'
      security:
        - bearerAuth: []
    x-summary: Blacklist Monitors
  /blacklist-monitors/{identifier}/report:
    get:
      summary: Blacklist Report
      description: |
        API call used to get the blacklist report for a specific blacklist monitor.
      parameters:
        - name: identifier
          in: path
          description: The blacklist monitor identifier; can be the 32 characters long monitor ID, the IP address or the hostname of the blacklist monitor.
          required: true
          style: simple
          schema:
            type: string
        - name: date
          in: query
          description: Report date in `YYYY-MM-DD` format. Defaults to the current date.
          required: false
          style: form
          schema:
            type: string
            pattern: "^(19|20)\\d{2}-(0[1-9]|1[0-2])-([0-2][0-9]|3[01])$"
      responses:
        '200':
          description: Successful Response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    minLength: 32
                    maxLength: 32
                    description: The unique blacklist monitor ID.
                  name:
                    type: string
                    description: The blacklist monitor's name.
                  type:
                    type: string
                    enum: [ipv4, domain]
                    description: The type of blacklist monitor.
                  target:
                    type: string
                    description: The monitored target.
                  report_id:
                    type: string
                    minLength: 32
                    maxLength: 32
                    description: | 
                     The unique blacklist report ID for this blacklist monitor. Can be used to form the non white-label report URL: `https://hetrixtools.com/report/blacklist/{report_id}/` and the white-label report URL: `https://yourdomain.com/report/blacklist/{report_id}/`.
                  listed:
                    type: array
                    description: The array of blacklists that have listed the monitored target on the requested date.
                    items:
                      type: object
                      properties:
                        rbl:
                          type: string
                          description: The RBL name.
                        delist:
                          type: string
                          description: The delist URL for this RBL.
              example:
                id: "3f1b14944123c3878d9a372d54c3e003"
                name: "my-monitor"
                type: ipv4
                target: "203.0.113.1"
                report_id: "abcdef1234567890abcdef1234567890"
                listed:
                  - rbl: "all.spamrats.com"
                    delist: "http://www.spamrats.com/lookup.php?ip=203.0.113.1"
                  - rbl: "b.barracudacentral.org"
                    delist: "http://www.barracudacentral.org/rbl/removal-request/203.0.113.1"
                  - rbl: "zen.spamhaus.org"
                    delist: "https://check.spamhaus.org/results/?query=203.0.113.1"
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/RateLimitedError'
      security:
        - bearerAuth: []
    x-summary: Blacklist Report
  /uptime-monitors:
    get:
      summary: Uptime Monitors
      description: |
        API call used to get uptime monitors and their details.
      parameters:
        - name: per_page
          in: query
          description: Number of monitors returned per page.
          style: form
          explode: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 200
        - name: page
          in: query
          description: Which page of the paginated results to return.
          style: form
          explode: false
          schema:
            type: integer
            default: 1
            minimum: 1
            maximum: 10000
        - name: id
          in: query
          description: Filter results by monitor ID. This will fetch just the monitor with the specified ID and ignore the name, target, and category filters. Other filters, including private_notes_search, still apply.
          required: false
          style: form
          schema:
            type: string
            pattern: "^[a-zA-Z0-9]{32}$"
            minLength: 32
            maxLength: 32
        - name: name
          in: query
          description: Filter results by name (accepts partial or full name).
          required: false
          style: form
          schema:
            type: string
            pattern: "^[a-zA-Z0-9 .-]+$"
        - name: target
          in: query
          description: Filter results by monitored target (accepts partial or full target).
          required: false
          style: form
          schema:
            type: string
            pattern: "^[a-zA-Z0-9:.-]+$"
        - name: category
          in: query
          description: Filter results by category (accepts partial or full category name).
          required: false
          style: form
          schema:
            type: string
            pattern: "^[a-zA-Z0-9 .-]+$"
        - name: private_notes_search
          in: query
          description: |
            Filter results by private note content. Matching is case-insensitive, and every space-separated term must occur as a substring in the notes, in any order. For example, `prod db` matches notes containing both `prod` and `db`.

            Accepts 1-64 ASCII bytes after trimming leading and trailing spaces. Allowed characters are letters, numbers, spaces, dots (`.`), dashes (`-`), and colons (`:`), with at least one letter or number required. Encode spaces as `%20` or `+`; a literal plus sign (`%2B`) is not supported as a search character. An empty value, a repeated `private_notes_search` parameter, an array value, or another invalid value returns `400`.

            Requires both the GET Uptime Monitors and GET Private Notes API-key permissions. Private note text is not included in the response. This filter also applies when `id` is provided, and pagination and `meta.total_filtered` reflect the matching monitors. Recent note changes may take a short time to appear in search results.
          required: false
          style: form
          schema:
            type: string
            minLength: 1
            pattern: '^[A-Za-z0-9 .:-]*[A-Za-z0-9][A-Za-z0-9 .:-]*$'
          example: prod db
        - name: type
