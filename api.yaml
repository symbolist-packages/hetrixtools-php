    get:
      summary: Location Fail Log
      description: |
        API call used to get an uptime monitor's Location Fail Log.
      parameters:
        - name: monitor_id
          in: path
          description: The unique uptime monitor id, which can be found by running the [GET - Uptime Monitors](https://docs.hetrixtools.com/api/v3/#/paths/~1uptime-monitors/get) API.
          required: true
          style: simple
          explode: false
          schema:
            type: string
        - name: timestamp
          in: query
          description: The timestamp when to start scanning for log entries. If no timestamp is provided, the scanning will start at the current timestamp.
          required: false
          style: form
          explode: false
          schema:
            type: integer
        - name: minutes
          in: query
          description: |
            The number of minutes containing log entries to get. Minutes without log entries are not counted/considered, and each minute may contain multiple log entries.  
            *Example:* A value of `10` will scan through the logs, in a descending order starting from the `timestamp`, until it finds 10 different minutes containing log entries.
          style: form
          explode: false
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Successful Response.
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      entries:
                        type: array
                        items:
                          type: object
                          properties:
                            timestamp:
                              type: integer
                              description: Timestamp at which this error has been encountered by the monitoring node.
                            location:
                              type: string
                              description: The location and the specific monitoring node from that location that has logged in the error.
                            data:
                              type: string
                              description: The exact error that has been encountered by the monitoring node.
                  - type: object
                    properties:
                      meta:
                        type: object
                        properties:
