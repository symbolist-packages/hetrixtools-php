    put:
      summary: Warning Policies
      description: |
        API call used to update an uptime monitor's Server Agent warning policies.

        Only the warning policies included in the request body are updated, all the others are left unchanged.

        Each warning policy can optionally have its own Contact List (`contact_list`), overwriting the uptime monitor's Contact List. This field is fully optional; when it isn't provided, the warning policy's current Contact List overwrite (if any) is left unchanged, and warning policies without such an overwrite send their notifications to the uptime monitor's Contact List.

        Disabling a warning policy (`enabled` set to `false`) removes it, along with its Contact List overwrite (if any).
      parameters:
        - name: monitor_id
          in: path
          description: The unique uptime monitor id, which can be found by running the [GET - Uptime Monitors](https://docs.hetrixtools.com/api/v3/#/paths/~1uptime-monitors/get) API.
          required: true
          style: simple
          explode: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  properties:
                    agent_data_warn:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                          description: Defines whether or not this policy is enabled.
                        threshold:
                          type: integer
                          enum: [3, 5, 10, 15, 30, 60]
                          description: The number of consecutive minutes without agent data would issue a warning.
                        warn_frequency:
                          type: integer
                          enum: [5, 10, 15, 30, 60, 180, 360, 720, 1440]
                          description: The minimum number of minutes between each issued warning.
                        contact_list:
                          type: string
                          nullable: true
                          description: |
                            Optional. The Contact List that this warning's notifications are sent to, overwriting the uptime monitor's Contact List.  
                            - omitted - the current Contact List overwrite (if any) is left unchanged
                            - `null` (or `default`) - removes the Contact List overwrite, this warning's notifications are sent to the uptime monitor's Contact List
                            - `none` - mutes this warning's notifications
                            - a contact list ID - this warning's notifications are sent to this contact list, which can be found by running the [GET - Contact Lists](https://docs.hetrixtools.com/api/v3/#/paths/~1contact-lists/get) API

                            Disabling this warning (`enabled` set to `false`) also removes its Contact List overwrite (if any).
                    cpu_usage_warn:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                          description: Defines whether or not this policy is enabled.
                        threshold:
                          type: integer
                          minimum: 1
                          maximum: 100
                          description: The usage (percent) at which and over which a warning is issued.
                        time_frame:
                          type: integer
                          enum: [1, 3, 5, 10, 15, 30, 60]
